# Lido apenas quando a Netlify constroi a partir do repositorio.
# Em deploy manual (arrastar a pasta) e ignorado. As rotas nao estao aqui por
# isso: vivem no frontend/public/_redirects, que o build copia para dentro de
# build/ e que a Netlify le nos dois casos.

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "frontend/build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Os assets do Next levam hash no nome, portanto podem ser guardados para
# sempre. As paginas nunca, senao ninguem ve uma versao nova.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
